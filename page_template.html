<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="alternate" type="application/rss+xml" href="feed.xml" title="__TITLE__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Palette borrows from H&E staining: haematoxylin violet for interface, eosin pink for relevance. */
:root {
  --bg: #171a21; --surface: #1f232c; --line: #2d323d;
  --text: #e4e6ec; --muted: #8e95a4;
  --hema: #aa9dff; --eosin: #ff8fbf;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f5f8; --surface: #ffffff; --line: #dedbe6;
  --text: #1c1d24; --muted: #646a78;
  --hema: #4a39b8; --eosin: #c22d6c;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: var(--hema); }
:focus-visible { outline: 2px solid var(--hema); outline-offset: 2px; border-radius: 3px; }

header {
  position: sticky; top: 0; z-index: 1; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.bar { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: grid; gap: 10px; }
.top { display: flex; align-items: baseline; gap: 12px; }
h1 { font: 600 1.15rem/1.2 "Source Serif 4", Georgia, serif; margin: 0; flex: 1; }
.top a, .top button { font-size: .85rem; }
button {
  font: inherit; color: var(--hema); background: none; border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 10px; cursor: pointer;
}
.filter { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: .9rem; }
.filter label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
input[type=checkbox] { accent-color: var(--hema); width: 16px; height: 16px; }
input[type=range] { accent-color: var(--eosin); flex: 1; min-width: 140px; }
#min:disabled { opacity: .35; }
#val { font: 600 1.05rem "Source Serif 4", Georgia, serif; min-width: 3.2em; font-variant-numeric: tabular-nums; }
#count { color: var(--muted); }
#reset[hidden] { display: none; }

main { max-width: 760px; margin: 0 auto; padding: 4px 16px 48px; }
.status { color: var(--muted); font-size: .8rem; margin: 12px 0 0; }
h2 {
  font-size: .8rem; font-weight: 600; color: var(--muted); letter-spacing: .02em;
  margin: 22px 0 4px; padding-bottom: 4px; border-bottom: 1px solid var(--line);
}
details { border-bottom: 1px solid var(--line); }
summary {
  list-style: none; cursor: pointer; padding: 11px 0;
  display: grid; grid-template-columns: 2.6em 1fr; gap: 0 12px;
}
summary::-webkit-details-marker { display: none; }
/* Score number and bar tint toward eosin as relevance rises (--p = score / 3). */
.score {
  grid-row: span 2; font: 600 1.15rem/1.3 "Source Serif 4", Georgia, serif; font-variant-numeric: tabular-nums;
  color: color-mix(in oklab, var(--eosin) calc(var(--p) * 100%), var(--muted));
}
.score i {
  display: block; height: 3px; margin-top: 4px; border-radius: 2px; background: var(--line);
  background-image: linear-gradient(currentColor, currentColor);
  background-size: calc(var(--p) * 100%) 100%; background-repeat: no-repeat;
}
.title { font: 400 1.05rem/1.35 "Source Serif 4", Georgia, serif; }
details[open] .title { font-weight: 600; }
.meta { color: var(--muted); font-size: .8rem; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 0 14px; }
.below .title, .below .score { opacity: .6; }
.tag { color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.body { padding: 0 0 16px calc(2.6em + 12px); }
.body p { margin: 0 0 12px; max-width: 68ch; color: var(--text); font-size: .95rem; line-height: 1.6; }
.body .none { color: var(--muted); font-style: italic; }
.read {
  display: inline-block; text-decoration: none; font-weight: 600; font-size: .9rem;
  border: 1px solid var(--hema); border-radius: 6px; padding: 5px 12px;
}
.empty { color: var(--muted); padding: 32px 0; }
@media (max-width: 520px) {
  .body { padding-left: 0; }
  summary { grid-template-columns: 2.3em 1fr; gap: 0 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  details[open] .body { animation: open .18s ease-out; }
  @keyframes open { from { opacity: 0; transform: translateY(-4px); } }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="top">
      <h1>__TITLE__</h1>
      <a href="feed.xml">RSS</a>
      <button id="theme" type="button">Light mode</button>
    </div>
    <div class="filter">
      <label><input type="checkbox" id="on" checked> Filter by score</label>
      <input type="range" id="min" min="0" max="3" step="0.1" aria-label="Minimum score">
      <span id="val"></span>
      <button id="reset" type="button" hidden>Reset to feed threshold</button>
      <span id="count"></span>
    </div>
  </div>
</header>
<main>
  <p class="status" id="status"></p>
  <div id="list"></div>
</main>
<script type="application/json" id="data">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = id => document.getElementById(id);
const on = $("on"), min = $("min"), list = $("list");

// Theme: dark by default; the light choice is remembered on this device.
const setTheme = t => {
  document.documentElement.dataset.theme = t;
  $("theme").textContent = t === "dark" ? "Light mode" : "Dark mode";
};
try { setTheme(localStorage.getItem("theme") || "dark"); } catch { setTheme("dark"); }
$("theme").onclick = () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  setTheme(t);
  try { localStorage.setItem("theme", t); } catch {}
};

$("status").textContent =
  `Updated ${D.run.at} UTC. ${D.run.new} new articles scored in the last run. ` +
  `The RSS feed includes articles scoring ${D.threshold} or higher.`;
min.value = D.threshold;

const day = d => new Date(d + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
// Shorter display names for the journals' own feed titles.
const journal = s => s.replace(/ Current Issue$/, "")
  .replace(/^bioRxiv Subject Collection: .*/, "bioRxiv preprint")
  .replace(/^Cancer : nature\.com subject feeds$/, "Nature Portfolio");
const site = url => { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return "journal site"; } };
// Newest day first; within a day, highest score first.
D.items.sort((a, b) => b.date.slice(0, 10).localeCompare(a.date.slice(0, 10)) || b.score - a.score);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function item(a) {
  const d = el("details", a.score < D.threshold ? "below" : "");
  const s = el("summary");
  const sc = el("span", "score", a.score.toFixed(1));
  sc.style.setProperty("--p", Math.max(0, Math.min(1, a.score / 3)));
  sc.append(el("i"));
  const meta = el("div", "meta");
  meta.append(el("span", "", journal(a.source)));
  if (a.type) meta.append(el("span", "", a.type));
  if (a.score < D.threshold) meta.append(el("span", "tag", "Not in RSS feed"));
  const main = el("div");
  main.append(el("div", "title", a.title), meta);
  s.append(sc, main);
  const body = el("div", "body");
  body.append(a.abstract ? el("p", "", a.abstract) : el("p", "none", "No abstract available."));
  const r = el("a", "read", `Read on ${site(a.link)}`);
  r.href = a.link; r.target = "_blank"; r.rel = "noopener";
  body.append(r);
  d.append(s, body);
  return d;
}

function render() {
  const cut = on.checked ? +min.value : -Infinity;
  min.disabled = !on.checked;
  $("val").textContent = on.checked ? `≥ ${(+min.value).toFixed(1)}` : "All";
  $("reset").hidden = !on.checked || +min.value === D.threshold;
  const shown = D.items.filter(a => a.score >= cut);
  $("count").textContent = `${shown.length} of ${D.items.length} articles`;
  list.replaceChildren();
  if (!shown.length) {
    list.append(el("p", "empty", "No articles at this score. Lower the minimum or turn off the filter."));
    return;
  }
  let last;
  for (const a of shown) {
    const d = a.date.slice(0, 10);
    if (d !== last) { list.append(el("h2", "", day(d))); last = d; }
    list.append(item(a));
  }
}
on.onchange = render;
min.oninput = render;
$("reset").onclick = () => { min.value = D.threshold; render(); };
render();
</script>
</body>
</html>
